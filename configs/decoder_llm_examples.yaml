# Example configurations for decoder-only LLM training
# Use these as templates for your experiments

# ============================================
# Qwen Models
# ============================================

qwen_0.5b_gsm8k_lora:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dataset: "gsm8k"
  tune_method: "lora"
  lora_rank: 8
  lora_alpha: 16
  learning_rate: 5e-5
  batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 10000
  use_cot: true
  bf16: true

qwen_1.5b_math_lora:
  model_name: "Qwen/Qwen2.5-1.5B-Instruct"
  dataset: "math"
  tune_method: "lora"
  lora_rank: 16
  lora_alpha: 32
  learning_rate: 3e-5
  batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 15000
  use_cot: true
  bf16: true

qwen_7b_gsm8k_lora:
  model_name: "Qwen/Qwen2.5-7B-Instruct"
  dataset: "gsm8k"
  tune_method: "lora"
  lora_rank: 32
  lora_alpha: 64
  learning_rate: 1e-5
  batch_size: 1
  gradient_accumulation_steps: 16
  max_steps: 20000
  use_cot: true
  bf16: true

# ============================================
# Llama Models
# ============================================

llama_1b_gsm8k_lora:
  model_name: "meta-llama/Llama-3.2-1B-Instruct"
  dataset: "gsm8k"
  tune_method: "lora"
  lora_rank: 8
  lora_alpha: 16
  learning_rate: 5e-5
  batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 10000
  use_cot: true
  bf16: true

llama_3b_math_lora:
  model_name: "meta-llama/Llama-3.2-3B-Instruct"
  dataset: "math"
  tune_method: "lora"
  lora_rank: 16
  lora_alpha: 32
  learning_rate: 3e-5
  batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 15000
  use_cot: true
  bf16: true

# ============================================
# Adapter Tuning Examples
# ============================================

qwen_0.5b_gsm8k_adapter:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dataset: "gsm8k"
  tune_method: "adapter"
  adapter_size: 64
  learning_rate: 5e-5
  batch_size: 4
  gradient_accumulation_steps: 4
  max_steps: 10000
  use_cot: true
  bf16: true

# ============================================
# Full Fine-tuning (High Resource)
# ============================================

qwen_0.5b_gsm8k_full:
  model_name: "Qwen/Qwen2.5-0.5B-Instruct"
  dataset: "gsm8k"
  tune_method: "model"
  learning_rate: 1e-5
  batch_size: 2
  gradient_accumulation_steps: 8
  max_steps: 5000
  use_cot: true
  bf16: true

# ============================================
# Mode Connectivity Experiment Setups
# ============================================

mode_connectivity_different_seeds:
  description: "Train two models with different seeds to study mode connectivity"
  experiments:
    - name: "model_seed42"
      seed: 42
      config: "qwen_0.5b_gsm8k_lora"
    - name: "model_seed123"
      seed: 123
      config: "qwen_0.5b_gsm8k_lora"
  analysis:
    num_points: 11
    plot: true

mode_connectivity_different_lr:
  description: "Compare models trained with different learning rates"
  experiments:
    - name: "model_lr5e5"
      learning_rate: 5e-5
      config: "qwen_0.5b_gsm8k_lora"
    - name: "model_lr1e4"
      learning_rate: 1e-4
      config: "qwen_0.5b_gsm8k_lora"
  analysis:
    num_points: 11
    plot: true

mode_connectivity_different_steps:
  description: "Compare early vs late training checkpoints"
  experiments:
    - checkpoint_1: "checkpoint-5000"
      checkpoint_2: "checkpoint-10000"
  analysis:
    num_points: 21  # More points for finer analysis
    plot: true

# ============================================
# Hyperparameter Search Ranges
# ============================================

hyperparameter_search:
  learning_rate: [1e-5, 3e-5, 5e-5, 1e-4]
  lora_rank: [4, 8, 16, 32]
  lora_alpha: [8, 16, 32, 64]
  batch_size: [2, 4, 8]
  gradient_accumulation_steps: [4, 8, 16]
  warmup_steps: [100, 500, 1000]
